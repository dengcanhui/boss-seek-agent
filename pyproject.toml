[project]
name = "boss-seek-agent"
version = "0.1.0"
description = "BOSS job-search agent starter with deterministic business services + LLM tool calling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "ruyiPage[async]>=1.2.72,<2",
  "openai>=1.50",
]

[project.scripts]
boss-seek-agent = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "web/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/js/*.js",
  "web/static/js/core/*.js",
  "web/static/js/features/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=runtime/pytest"
